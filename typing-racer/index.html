<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type Racer — Black &amp; White Edition</title>
<style>
  :root{
    --paper:#f4f4f2;
    --ink:#111112;
    --road:#c9c9c7;
    --road-line:#f4f4f2;
    --panel:#ffffff;
    --panel-border:#111112;
    --muted:#6b6b6d;
    --correct:#111112;
    --incorrect:#ffffff;
    --incorrect-bg:#111112;
    --accent:#111112;
    --lane-alt:#dcdcda;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#101012;
      --ink:#f2f2f0;
      --road:#2b2b2d;
      --road-line:#101012;
      --panel:#19191b;
      --panel-border:#f2f2f0;
      --muted:#a0a0a2;
      --correct:#f2f2f0;
      --incorrect:#101012;
      --incorrect-bg:#f2f2f0;
      --accent:#f2f2f0;
      --lane-alt:#222224;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    --font-display:'Arial Black','Helvetica Neue',Impact,Haettenschweiler,sans-serif;
    --font-mono:'Courier New', ui-monospace, Menlo, Consolas, monospace;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-mono);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  .app{width:100%;max-width:920px;}
  h1{
    font-family:var(--font-display);
    font-size:clamp(28px,5vw,44px);
    letter-spacing:4px;
    text-align:center;
    margin:0 0 4px;
    text-transform:uppercase;
  }
  .subtitle{
    font-family:var(--font-mono);
    text-align:center;
    color:var(--muted);
    letter-spacing:2px;
    font-size:12px;
    text-transform:uppercase;
    margin:0 0 28px;
  }
  .checker-bar{
    height:10px;
    margin:0 0 26px;
    background-image:
      linear-gradient(45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(-45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--ink) 75%),
      linear-gradient(-45deg, transparent 75%, var(--ink) 75%);
    background-size:10px 10px;
    background-position:0 0, 0 5px, 5px -5px, -5px 0;
    background-color:var(--paper);
    border-top:1px solid var(--ink);
    border-bottom:1px solid var(--ink);
  }
  .screen{display:none;}
  .screen.active{display:block;}

  /* ---- Car select screen ---- */
  .car-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
    margin-bottom:26px;
  }
  .car-card{
    background:var(--panel);
    border:2px solid var(--panel-border);
    border-radius:10px;
    padding:14px;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .car-card:hover{transform:translateY(-3px);}
  .car-card.selected{
    box-shadow:0 0 0 3px var(--ink) inset;
    background:var(--lane-alt);
  }
  .car-card .car-svg{width:100%;height:70px;}
  .car-card h3{font-family:var(--font-display);margin:8px 0 2px;font-size:15px;letter-spacing:1px;text-transform:uppercase;}
  .car-card p{margin:0;font-size:11px;color:var(--muted);}

  .option-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .option-row span.label{font-size:12px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .pill-btn{
    font-family:var(--font-display);
    background:var(--panel);
    color:var(--ink);
    border:2px solid var(--panel-border);
    border-radius:999px;
    padding:8px 18px;
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .pill-btn.active{background:var(--ink);color:var(--paper);}

  .primary-btn{
    display:block;
    margin:0 auto;
    font-family:var(--font-display);
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--ink);
    padding:14px 36px;
    font-size:14px;
    letter-spacing:3px;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:6px;
  }
  .primary-btn:disabled{opacity:.35;cursor:not-allowed;}
  .primary-btn:not(:disabled):hover{background:transparent;color:var(--ink);}

  .ghost-btn{
    font-family:var(--font-display);
    background:transparent;
    color:var(--ink);
    border:2px solid var(--ink);
    padding:12px 26px;
    font-size:13px;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:6px;
  }
  .ghost-btn:hover{background:var(--ink);color:var(--paper);}

  /* ---- Race screen ---- */
  .stats-bar{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .stat{
    flex:1;
    min-width:90px;
    background:var(--panel);
    border:2px solid var(--panel-border);
    border-radius:8px;
    padding:8px 12px;
    text-align:center;
  }
  .stat .val{font-size:22px;font-weight:bold;}
  .stat .lbl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}

  .track{
    position:relative;
    background:var(--road);
    border:2px solid var(--ink);
    border-radius:10px;
    padding:6px 0;
    margin-bottom:20px;
    overflow:hidden;
  }
  .lane{
    position:relative;
    height:64px;
    border-bottom:2px dashed var(--road-line);
  }
  .lane:last-child{border-bottom:none;}
  .lane:nth-child(odd){background:rgba(0,0,0,0.03);}
  .lane-tag{
    font-family:var(--font-display);
    position:absolute;
    left:6px;
    top:4px;
    font-size:9px;
    letter-spacing:1px;
    color:var(--muted);
    text-transform:uppercase;
    z-index:2;
  }
  .finish-line{
    position:absolute;
    top:0;right:6px;bottom:0;
    width:14px;
    background-image:
      linear-gradient(45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(-45deg, var(--ink) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, var(--ink) 75%),
      linear-gradient(-45deg, transparent 75%, var(--ink) 75%);
    background-size:7px 7px;
    background-position:0 0, 0 3.5px, 3.5px -3.5px, -3.5px 0;
    background-color:var(--paper);
    border-left:2px solid var(--ink);
    border-right:2px solid var(--ink);
    z-index:1;
  }
  .racer{
    position:absolute;
    top:50%;
    left:6px;
    width:76px;
    height:38px;
    transform:translate(0,-50%);
    z-index:3;
    will-change:left;
  }
  .racer .car-svg{width:100%;height:100%;}
  .racer .car-name{
    font-family:var(--font-display);
    position:absolute;
    top:-14px;left:0;
    font-size:9px;
    letter-spacing:1px;
    color:var(--muted);
    white-space:nowrap;
  }

  .text-display{
    background:var(--panel);
    border:2px solid var(--panel-border);
    border-radius:8px;
    padding:18px 20px;
    font-size:19px;
    line-height:1.7;
    letter-spacing:.5px;
    margin-bottom:14px;
    user-select:none;
    min-height:100px;
  }
  .text-display span{position:relative;}
  .ch-correct{color:var(--correct);opacity:.55;}
  .ch-incorrect{color:var(--incorrect);background:var(--incorrect-bg);border-radius:2px;}
  .ch-current{
    border-left:2px solid var(--ink);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{border-color:transparent;}}
  .ch-pending{color:var(--muted);}

  #typed-input{
    width:100%;
    padding:12px 14px;
    font-family:inherit;
    font-size:16px;
    background:var(--panel);
    color:var(--ink);
    border:2px solid var(--panel-border);
    border-radius:8px;
    outline:none;
  }
  .hint{
    text-align:center;
    font-size:11px;
    color:var(--muted);
    margin-top:8px;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .countdown-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.55);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:56px;
    font-weight:bold;
    z-index:10;
    border-radius:8px;
  }

  /* ---- Results screen ---- */
  .standings{list-style:none;margin:0 0 24px;padding:0;}
  .standings li{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--panel);
    border:2px solid var(--panel-border);
    border-radius:8px;
    padding:10px 16px;
    margin-bottom:10px;
  }
  .standings li.you{background:var(--lane-alt);}
  .rank{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:bold;
    width:34px;
    text-align:center;
  }
  .standings .car-svg{width:60px;height:30px;flex-shrink:0;}
  .standings .who{flex:1;}
  .standings .who .name{font-family:var(--font-display);font-size:13px;letter-spacing:1px;text-transform:uppercase;}
  .standings .who .time{font-size:11px;color:var(--muted);}
  .results-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .results-summary{
    font-family:var(--font-display);
    text-align:center;
    margin-bottom:22px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:1px;
    text-transform:uppercase;
  }

  /* ---- Car SVG coloring (pure black & white, theme-aware) ---- */
  .car-svg .body{ fill:var(--ink); stroke:var(--paper); stroke-width:1.5; }
  .car-svg .cabin{ fill:var(--paper); stroke:var(--ink); stroke-width:1.5; }
  .car-svg .wheel{ fill:var(--ink); stroke:var(--paper); stroke-width:1; }
  .car-svg .wing{ fill:var(--ink); stroke:var(--paper); stroke-width:1; }
  .car-svg .divider{ stroke:var(--ink); stroke-width:2; }
  .car-svg .divider-light{ stroke:var(--paper); stroke-width:2; opacity:.85; }
</style>
</head>
<body>
<div class="app">
  <h1>Type Racer</h1>
  <p class="subtitle">Black &amp; White Edition</p>
  <div class="checker-bar"></div>

  <!-- SCREEN 1: Car select -->
  <section id="screen-select" class="screen active">
    <div class="car-grid" id="car-grid"></div>

    <div class="option-row" id="difficulty-row">
      <span class="label">Difficulty</span>
      <button class="pill-btn" data-difficulty="easy">Easy</button>
      <button class="pill-btn active" data-difficulty="medium">Medium</button>
      <button class="pill-btn" data-difficulty="hard">Hard</button>
    </div>

    <button class="primary-btn" id="start-btn" disabled>Start Race</button>
  </section>

  <!-- SCREEN 2: Race -->
  <section id="screen-race" class="screen">
    <div class="stats-bar">
      <div class="stat"><div class="val" id="stat-time">0.0s</div><div class="lbl">Time</div></div>
      <div class="stat"><div class="val" id="stat-wpm">0</div><div class="lbl">WPM</div></div>
      <div class="stat"><div class="val" id="stat-acc">100%</div><div class="lbl">Accuracy</div></div>
    </div>

    <div class="track" id="track">
      <div class="finish-line"></div>
      <!-- lanes injected here -->
    </div>

    <div class="text-display" id="text-display"></div>
    <input type="text" id="typed-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Click here and start typing...">
    <p class="hint">Type the text above exactly to move your car. Backspace fixes mistakes.</p>
  </section>

  <!-- SCREEN 3: Results -->
  <section id="screen-results" class="screen">
    <p class="results-summary" id="results-summary"></p>
    <ol class="standings" id="standings"></ol>
    <div class="results-actions">
      <button class="ghost-btn" id="retry-btn">Race Again</button>
      <button class="ghost-btn" id="change-car-btn">Change Car</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- Car designs (top-down, pure black & white) ---------------- */
  const CARS = [
    {
      id:"sedan", name:"Sedan", desc:"Balanced & steady",
      svg:`<svg viewBox="0 0 240 110" class="car-svg" xmlns="http://www.w3.org/2000/svg">
        <rect x="35" y="6" width="26" height="14" rx="4" class="wheel"/>
        <rect x="35" y="90" width="26" height="14" rx="4" class="wheel"/>
        <rect x="165" y="6" width="26" height="14" rx="4" class="wheel"/>
        <rect x="165" y="90" width="26" height="14" rx="4" class="wheel"/>
        <path d="M20 55 Q20 25 55 22 L185 22 Q220 25 220 55 Q220 85 185 88 L55 88 Q20 85 20 55 Z" class="body"/>
        <path d="M72 30 L172 30 Q186 30 186 55 Q186 80 172 80 L72 80 Q58 80 58 55 Q58 30 72 30 Z" class="cabin"/>
        <line x1="119" y1="30" x2="119" y2="80" class="divider"/>
      </svg>`
    },
    {
      id:"sports", name:"Sports Car", desc:"Low, fast & sleek",
      svg:`<svg viewBox="0 0 240 110" class="car-svg" xmlns="http://www.w3.org/2000/svg">
        <rect x="28" y="10" width="24" height="13" rx="4" class="wheel"/>
        <rect x="28" y="87" width="24" height="13" rx="4" class="wheel"/>
        <rect x="176" y="14" width="22" height="13" rx="4" class="wheel"/>
        <rect x="176" y="83" width="22" height="13" rx="4" class="wheel"/>
        <path d="M15 55 Q16 38 48 33 L140 27 Q192 27 228 52 Q228 55 228 58 Q192 83 140 83 L48 77 Q16 72 15 55 Z" class="body"/>
        <path d="M60 38 L130 34 Q150 34 158 55 Q150 76 130 76 L60 72 Q50 55 60 38 Z" class="cabin"/>
        <rect x="8" y="33" width="8" height="44" rx="2" class="wing"/>
        <rect x="6" y="30" width="14" height="6" rx="2" class="wing"/>
        <rect x="6" y="74" width="14" height="6" rx="2" class="wing"/>
      </svg>`
    },
    {
      id:"truck", name:"Pickup Truck", desc:"Heavy hauler",
      svg:`<svg viewBox="0 0 240 110" class="car-svg" xmlns="http://www.w3.org/2000/svg">
        <rect x="35" y="6" width="26" height="14" rx="4" class="wheel"/>
        <rect x="35" y="90" width="26" height="14" rx="4" class="wheel"/>
        <rect x="165" y="6" width="26" height="14" rx="4" class="wheel"/>
        <rect x="165" y="90" width="26" height="14" rx="4" class="wheel"/>
        <path d="M20 60 Q20 40 32 40 L32 55 Q32 78 55 82 L205 82 Q222 78 222 55 Q222 30 195 26 L155 24 Q140 24 140 40 L140 60 Z" class="body"/>
        <path d="M158 30 L192 30 Q206 32 206 50 L140 50 L140 40 Q142 30 158 30 Z" class="cabin"/>
        <line x1="38" y1="52" x2="130" y2="52" class="divider-light"/>
        <line x1="38" y1="63" x2="130" y2="63" class="divider-light"/>
        <line x1="38" y1="74" x2="130" y2="74" class="divider-light"/>
      </svg>`
    },
    {
      id:"van", name:"Van", desc:"Long & boxy",
      svg:`<svg viewBox="0 0 240 110" class="car-svg" xmlns="http://www.w3.org/2000/svg">
        <rect x="32" y="6" width="24" height="14" rx="4" class="wheel"/>
        <rect x="32" y="90" width="24" height="14" rx="4" class="wheel"/>
        <rect x="170" y="6" width="24" height="14" rx="4" class="wheel"/>
        <rect x="170" y="90" width="24" height="14" rx="4" class="wheel"/>
        <path d="M18 55 Q18 24 42 24 L198 24 Q224 24 224 55 Q224 86 198 86 L42 86 Q18 86 18 55 Z" class="body"/>
        <rect x="30" y="32" width="164" height="16" rx="4" class="cabin"/>
        <line x1="68" y1="32" x2="68" y2="48" class="divider"/>
        <line x1="106" y1="32" x2="106" y2="48" class="divider"/>
        <line x1="144" y1="32" x2="144" y2="48" class="divider"/>
        <line x1="182" y1="32" x2="182" y2="48" class="divider"/>
      </svg>`
    },
    {
      id:"formula", name:"Formula Racer", desc:"Open-wheel speedster",
      svg:`<svg viewBox="0 0 240 110" class="car-svg" xmlns="http://www.w3.org/2000/svg">
        <rect x="42" y="2" width="34" height="18" rx="6" class="wheel"/>
        <rect x="42" y="90" width="34" height="18" rx="6" class="wheel"/>
        <rect x="150" y="2" width="34" height="18" rx="6" class="wheel"/>
        <rect x="150" y="90" width="34" height="18" rx="6" class="wheel"/>
        <path d="M40 47 L185 42 Q210 42 224 55 Q210 68 185 68 L40 63 Q30 55 40 47 Z" class="body"/>
        <path d="M185 42 L224 55 L185 68 Z" class="cabin" opacity="0"/>
        <path d="M188 44 L222 55 L188 66 Z" class="body"/>
        <rect x="10" y="34" width="10" height="42" rx="3" class="wing"/>
        <rect x="8" y="30" width="18" height="6" rx="2" class="wing"/>
        <rect x="8" y="74" width="18" height="6" rx="2" class="wing"/>
        <rect x="220" y="46" width="10" height="18" rx="2" class="wing"/>
        <circle cx="70" cy="55" r="9" class="cabin"/>
      </svg>`
    }
  ];

  /* ---------------- Text prompts by difficulty ---------------- */
  const TEXTS = {
    easy:[
      "The black car raced past the white line.",
      "Fast cars race down the open road.",
      "Type each word to make your car go.",
      "Speed and accuracy win the race.",
      "The checkered flag waves at the end."
    ],
    medium:[
      "The sleek sports car hugged every corner while the heavy truck rumbled steadily behind it.",
      "Four racers lined up at the start, engines idling, waiting for the checkered flag to drop.",
      "Typing quickly is only useful if the words are correct, so slow down when you make a mistake.",
      "The formula racer's tires screeched as it overtook the van on the final straightaway.",
      "Practice makes perfect, and every race teaches you to type a little faster than before."
    ],
    hard:[
      "Beneath the roaring engines and the smell of burning rubber, five very different vehicles battled for first place around the twisting black and white circuit.",
      "The sedan's steady pace could not match the formula racer's explosive acceleration, yet consistency often wins longer races against reckless speed.",
      "As the pickup truck's tires kicked up gravel on the final corner, the sports car slipped past on the inside, its spoiler slicing cleanly through the wind.",
      "Precision typing, much like precision driving, rewards those who stay calm under pressure and correct their mistakes before they compound into bigger problems.",
      "The van, though far from the fastest vehicle on the track, finished admirably by never once drifting off the racing line through every single lap."
    ]
  };

  const AI_WPM_RANGES = {
    easy:[20,38],
    medium:[28,52],
    hard:[35,68]
  };

  /* ---------------- State ---------------- */
  let selectedCarId = null;
  let difficulty = "medium";
  let raceText = "";
  let racers = [];       // {id, name, carId, isPlayer, wpm, finishTimeMs, el, progress}
  let raceStartTime = 0;
  let rafId = null;
  let raceFinished = false;
  let totalTyped = 0;
  let mistakes = 0;
  let prevInputLen = 0;

  /* ---------------- DOM refs ---------------- */
  const screens = {
    select: document.getElementById("screen-select"),
    race: document.getElementById("screen-race"),
    results: document.getElementById("screen-results")
  };
  const carGrid = document.getElementById("car-grid");
  const startBtn = document.getElementById("start-btn");
  const difficultyRow = document.getElementById("difficulty-row");
  const track = document.getElementById("track");
  const textDisplay = document.getElementById("text-display");
  const typedInput = document.getElementById("typed-input");
  const statTime = document.getElementById("stat-time");
  const statWpm = document.getElementById("stat-wpm");
  const statAcc = document.getElementById("stat-acc");
  const standingsEl = document.getElementById("standings");
  const resultsSummary = document.getElementById("results-summary");
  const retryBtn = document.getElementById("retry-btn");
  const changeCarBtn = document.getElementById("change-car-btn");

  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.remove("active"));
    screens[name].classList.add("active");
  }

  function carById(id){ return CARS.find(c=>c.id===id); }

  /* ---------------- Build car select screen ---------------- */
  CARS.forEach(car=>{
    const card = document.createElement("div");
    card.className = "car-card";
    card.dataset.carId = car.id;
    card.innerHTML = `${car.svg}<h3>${car.name}</h3><p>${car.desc}</p>`;
    card.addEventListener("click", ()=>{
      document.querySelectorAll(".car-card").forEach(c=>c.classList.remove("selected"));
      card.classList.add("selected");
      selectedCarId = car.id;
      startBtn.disabled = false;
    });
    carGrid.appendChild(card);
  });

  difficultyRow.addEventListener("click", (e)=>{
    const btn = e.target.closest(".pill-btn");
    if(!btn) return;
    difficultyRow.querySelectorAll(".pill-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    difficulty = btn.dataset.difficulty;
  });

  startBtn.addEventListener("click", ()=>{
    if(!selectedCarId) return;
    setupRace();
  });

  retryBtn.addEventListener("click", setupRace);
  changeCarBtn.addEventListener("click", ()=> showScreen("select"));

  /* ---------------- Race setup ---------------- */
  function pickOtherCarIds(excludeId, count){
    const pool = CARS.map(c=>c.id).filter(id=>id!==excludeId);
    for(let i=pool.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
    return pool.slice(0,count);
  }

  function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function setupRace(){
    const pool = TEXTS[difficulty];
    raceText = randomFrom(pool);

    const aiIds = pickOtherCarIds(selectedCarId, 3);
    const [lo,hi] = AI_WPM_RANGES[difficulty];

    racers = [];
    racers.push({ id:"you", name:"You", carId:selectedCarId, isPlayer:true, wpm:0, progress:0 });
    aiIds.forEach((id,i)=>{
      const wpm = lo + Math.random()*(hi-lo);
      racers.push({ id:"ai"+i, name:carById(id).name, carId:id, isPlayer:false, wpm, progress:0 });
    });

    // shuffle lane order so player isn't always first
    for(let i=racers.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [racers[i],racers[j]] = [racers[j],racers[i]];
    }

    const wordCount = raceText.trim().split(/\s+/).length;
    racers.forEach(r=>{
      if(!r.isPlayer){
        r.finishTimeMs = (wordCount / r.wpm) * 60000;
      }
    });

    buildTrackDOM();
    buildTextDisplay();

    totalTyped = 0;
    mistakes = 0;
    prevInputLen = 0;
    raceFinished = false;
    typedInput.value = "";
    typedInput.disabled = true;

    statTime.textContent = "0.0s";
    statWpm.textContent = "0";
    statAcc.textContent = "100%";

    showScreen("race");
    runCountdown();
  }

  function buildTrackDOM(){
    // clear existing lanes (keep finish-line div)
    track.querySelectorAll(".lane").forEach(l=>l.remove());
    racers.forEach(r=>{
      const lane = document.createElement("div");
      lane.className = "lane";
      lane.innerHTML = `<span class="lane-tag">${r.isPlayer ? "YOU" : r.name}</span>`;
      const racerEl = document.createElement("div");
      racerEl.className = "racer";
      racerEl.innerHTML = `<span class="car-name">${r.isPlayer ? "You" : r.name}</span>${carById(r.carId).svg}`;
      lane.appendChild(racerEl);
      track.appendChild(lane);
      r.el = racerEl;
    });
  }

  function buildTextDisplay(){
    textDisplay.innerHTML = "";
    const frag = document.createDocumentFragment();
    raceText.split("").forEach((ch,i)=>{
      const span = document.createElement("span");
      span.className = "ch-pending";
      span.dataset.idx = i;
      span.textContent = ch;
      frag.appendChild(span);
    });
    textDisplay.appendChild(frag);
    updateCursor(0);
  }

  function updateCursor(pos){
    const spans = textDisplay.children;
    for(let i=0;i<spans.length;i++){
      spans[i].classList.remove("ch-current");
    }
    if(spans[pos]) spans[pos].classList.add("ch-current");
  }

  function runCountdown(){
    let count = 3;
    const overlay = document.createElement("div");
    overlay.className = "countdown-overlay";
    overlay.textContent = count;
    track.appendChild(overlay);
    const timer = setInterval(()=>{
      count--;
      if(count>0){
        overlay.textContent = count;
      } else if(count===0){
        overlay.textContent = "GO!";
      } else {
        clearInterval(timer);
        overlay.remove();
        beginRace();
      }
    },700);
  }

  function beginRace(){
    typedInput.disabled = false;
    typedInput.focus();
    raceStartTime = performance.now();
    rafId = requestAnimationFrame(raceLoop);
  }

  function raceLoop(now){
    const elapsed = now - raceStartTime;

    racers.forEach(r=>{
      if(r.isPlayer){
        // player progress set directly from typing
      } else {
        r.progress = Math.min(1, elapsed / r.finishTimeMs);
      }
      const pct = r.progress * 100;
      r.el.style.left = `calc(6px + ${pct}% * 0.86)`;
    });

    statTime.textContent = (elapsed/1000).toFixed(1) + "s";

    if(!raceFinished){
      rafId = requestAnimationFrame(raceLoop);
    }
  }

  typedInput.addEventListener("input", ()=>{
    if(raceFinished) return;
    const value = typedInput.value;

    if(value.length > prevInputLen){
      for(let i=prevInputLen;i<value.length;i++){
        totalTyped++;
        if(value[i] !== raceText[i]) mistakes++;
      }
    }
    prevInputLen = value.length;

    // clamp: never allow typing past the target length
    if(value.length > raceText.length){
      typedInput.value = value.slice(0, raceText.length);
      return;
    }

    // render highlighted text
    const spans = textDisplay.children;
    for(let i=0;i<raceText.length;i++){
      const span = spans[i];
      span.classList.remove("ch-correct","ch-incorrect","ch-pending","ch-current");
      if(i < value.length){
        span.classList.add(value[i] === raceText[i] ? "ch-correct" : "ch-incorrect");
      } else {
        span.classList.add("ch-pending");
      }
    }
    updateCursor(Math.min(value.length, raceText.length-1));

    const you = racers.find(r=>r.isPlayer);
    // progress by correctly-matched prefix length so the car reflects real accuracy
    let correctPrefix = 0;
    while(correctPrefix < value.length && value[correctPrefix] === raceText[correctPrefix]) correctPrefix++;
    you.progress = correctPrefix / raceText.length;

    const elapsedMin = (performance.now() - raceStartTime) / 60000;
    const wpm = elapsedMin > 0 ? Math.round((correctPrefix/5) / elapsedMin) : 0;
    you.wpm = wpm;
    statWpm.textContent = String(Math.max(0,wpm));
    const acc = totalTyped>0 ? Math.round(((totalTyped-mistakes)/totalTyped)*100) : 100;
    statAcc.textContent = Math.max(0,acc) + "%";

    if(value === raceText){
      finishRace();
    }
  });

  function finishRace(){
    raceFinished = true;
    typedInput.disabled = true;
    if(rafId) cancelAnimationFrame(rafId);
    const finishElapsed = performance.now() - raceStartTime;

    const you = racers.find(r=>r.isPlayer);
    you.finishTimeMs = finishElapsed;
    you.progress = 1;
    you.el.style.left = `calc(6px + 100% * 0.86)`;

    racers.forEach(r=>{
      if(!r.isPlayer){
        r.el.style.left = `calc(6px + ${r.progress*100}% * 0.86)`;
      }
    });

    setTimeout(showResults, 500);
  }

  function showResults(){
    const sorted = [...racers].sort((a,b)=>{
      const at = a.isPlayer ? a.finishTimeMs : a.finishTimeMs;
      const bt = b.isPlayer ? b.finishTimeMs : b.finishTimeMs;
      // racers who didn't finish (progress<1) rank by progress desc, finished ones by time
      const aFinished = a.progress >= 1;
      const bFinished = b.progress >= 1;
      if(aFinished && bFinished) return at - bt;
      if(aFinished) return -1;
      if(bFinished) return 1;
      return b.progress - a.progress;
    });

    standingsEl.innerHTML = "";
    sorted.forEach((r,i)=>{
      const li = document.createElement("li");
      if(r.isPlayer) li.classList.add("you");
      const timeLabel = r.progress>=1 ? (r.finishTimeMs/1000).toFixed(1)+"s" : Math.round(r.progress*100)+"% complete";
      li.innerHTML = `<span class="rank">${i+1}</span>${carById(r.carId).svg}<span class="who"><span class="name">${r.isPlayer?"You":r.name}</span><br><span class="time">${timeLabel}</span></span>`;
      standingsEl.appendChild(li);
    });

    const you = racers.find(r=>r.isPlayer);
    const place = sorted.findIndex(r=>r.isPlayer) + 1;
    const acc = totalTyped>0 ? Math.round(((totalTyped-mistakes)/totalTyped)*100) : 100;
    resultsSummary.textContent = `Finished P${place} of ${racers.length} — ${you.wpm} WPM — ${Math.max(0,acc)}% Accuracy`;

    showScreen("results");
  }

})();
</script>
</body>
</html>
