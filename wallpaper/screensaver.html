<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>UTI AMC — Password Policy Screensaver</title>
<style>
  :root {
    --navy-deep: #071b33;
    --uti-blue-bright: #1866c9;
    --uti-orange: #f68122;
    --ink-100: #f4f7fb;
    --ink-400: #9fb3cc;
    --line: rgba(244, 247, 251, 0.14);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--navy-deep);
    overflow: hidden;
    cursor: none;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  }

  canvas#net {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6vw;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 4vh;
    opacity: 0;
    animation: rise 1.1s 0.15s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .badge svg { flex: none; }

  .badge span {
    font-size: clamp(13px, 1.1vw, 17px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--uti-orange);
    font-weight: 700;
  }

  h1 {
    font-size: clamp(34px, 4.6vw, 84px);
    line-height: 1.16;
    font-weight: 700;
    color: var(--ink-100);
    letter-spacing: -0.5px;
    max-width: 18ch;
    text-wrap: balance;
    opacity: 0;
    animation: rise 1.1s 0.35s cubic-bezier(.2,.8,.2,1) forwards;
  }

  h1 b { color: var(--uti-orange); font-weight: 700; }

  .sub {
    margin-top: 3vh;
    font-size: clamp(16px, 1.35vw, 24px);
    color: var(--ink-400);
    max-width: 46ch;
    line-height: 1.6;
    opacity: 0;
    animation: rise 1.1s 0.55s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .rule {
    margin-top: 5vh;
    width: 64px;
    height: 2px;
    background: var(--uti-orange);
    opacity: 0;
    animation: grow 0.9s 0.8s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .footer {
    position: fixed;
    left: 0; right: 0; bottom: 5vh;
    text-align: center;
    font-size: clamp(12px, 0.95vw, 15px);
    color: var(--ink-400);
    letter-spacing: 0.5px;
    opacity: 0;
    animation: rise 1.1s 1s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .footer b { color: var(--ink-100); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes grow {
    from { opacity: 0; width: 0; }
    to   { opacity: 1; width: 64px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .badge, h1, .sub, .rule, .footer { animation: none !important; opacity: 1 !important; transform: none !important; width: 64px; }
    canvas#net { display: none; }
  }
</style>
</head>
<body>
  <canvas id="net"></canvas>

  <div class="stage">
    <div class="badge">
      <svg width="30" height="30" viewBox="0 0 44 44" fill="none">
        <rect x="1" y="1" width="42" height="42" rx="10" fill="#0d3868" stroke="#f68122" stroke-width="1.5"/>
        <path d="M22 12c-4.4 0-8 3.6-8 8v3h-1.5A1.5 1.5 0 0 0 11 24.5v10A1.5 1.5 0 0 0 12.5 36h19a1.5 1.5 0 0 0 1.5-1.5v-10a1.5 1.5 0 0 0-1.5-1.5H30v-3c0-4.4-3.6-8-8-8Zm0 3c2.76 0 5 2.24 5 5v3H17v-3c0-2.76 2.24-5 5-5Zm0 12.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z" fill="#f68122"/>
      </svg>
      <span>UTI AMC · Security Bulletin</span>
    </div>

    <h1>No dictionary words.<br>No predictable patterns.<br><b>No exceptions.</b></h1>

    <p class="sub">Effective immediately: new passwords must be 8+ characters with upper, lower, number &amp; symbol — reset stays on the same 90-day cycle.</p>

    <div class="rule"></div>

    <div class="footer">Questions? IT Helpdesk — <b>itheldesk@uti.co.in</b></div>
  </div>

  <script>
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var canvas = document.getElementById('net');
    var ctx = canvas.getContext('2d');
    var W, H, nodes;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    var COUNT = Math.max(24, Math.floor((W * H) / 55000));
    nodes = [];
    for (var i = 0; i < COUNT; i++) {
      nodes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.12,
        vy: (Math.random() - 0.5) * 0.12
      });
    }

    var LINK_DIST = Math.min(220, Math.max(140, W / 9));

    function step() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        n.x += n.vx; n.y += n.vy;
        if (n.x < 0 || n.x > W) n.vx *= -1;
        if (n.y < 0 || n.y > H) n.vy *= -1;
      }
      for (var i = 0; i < nodes.length; i++) {
        for (var j = i + 1; j < nodes.length; j++) {
          var a = nodes[i], b = nodes[j];
          var dx = a.x - b.x, dy = a.y - b.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < LINK_DIST) {
            ctx.strokeStyle = 'rgba(24, 102, 201, ' + (0.16 * (1 - dist / LINK_DIST)) + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
      for (var i = 0; i < nodes.length; i++) {
        ctx.fillStyle = 'rgba(24, 102, 201, 0.5)';
        ctx.beginPath();
        ctx.arc(nodes[i].x, nodes[i].y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      }
      if (!reduceMotion) requestAnimationFrame(step);
    }
    step();

    document.addEventListener('keydown', function () { window.close(); });
    document.addEventListener('mousedown', function () { window.close(); });
  </script>
</body>
</html>
